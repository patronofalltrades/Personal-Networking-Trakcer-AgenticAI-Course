<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Berkonnect two-account RLS verification output</title>
  <desc id="desc">A terminal-style view with seven passing checks for account isolation and database validation.</desc>
  <rect width="1200" height="600" rx="24" fill="#111827"/>
  <rect x="0" y="0" width="1200" height="72" rx="24" fill="#1f2937"/>
  <rect x="0" y="48" width="1200" height="24" fill="#1f2937"/>
  <circle cx="40" cy="36" r="9" fill="#fb7185"/>
  <circle cx="70" cy="36" r="9" fill="#fbbf24"/>
  <circle cx="100" cy="36" r="9" fill="#4ade80"/>
  <text x="600" y="43" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">Berkonnect production RLS verification · 2026-09-03</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
    <text x="54" y="125" fill="#86efac">PASS</text><text x="138" y="125" fill="#f3f4f6">Created two dedicated QA accounts.</text>
    <text x="54" y="185" fill="#86efac">PASS</text><text x="138" y="185" fill="#f3f4f6">User B could not read User A's contact.</text>
    <text x="54" y="245" fill="#86efac">PASS</text><text x="138" y="245" fill="#f3f4f6">User B could not update User A's contact.</text>
    <text x="54" y="305" fill="#86efac">PASS</text><text x="138" y="305" fill="#f3f4f6">User B could not delete User A's contact.</text>
    <text x="54" y="365" fill="#86efac">PASS</text><text x="138" y="365" fill="#f3f4f6">User A's contact remained unchanged.</text>
    <text x="54" y="425" fill="#86efac">PASS</text><text x="138" y="425" fill="#f3f4f6">PostgreSQL rejected a blank name and invalid priority.</text>
    <text x="54" y="485" fill="#86efac">PASS</text><text x="138" y="485" fill="#f3f4f6">Removed the temporary contact fixture.</text>
  </g>
  <text x="54" y="548" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Sanitized output: no credentials, tokens, email addresses, or database secrets.</text>
</svg>
